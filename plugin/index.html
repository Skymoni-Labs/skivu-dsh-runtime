<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机 DSH</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#182232;color:#edf2ff}*{box-sizing:border-box}body{margin:0;padding:30px 22px;max-width:640px}small{color:#b4c2da;letter-spacing:.1em}h1{font-size:30px;margin:16px 0 12px}p{line-height:1.7;color:#becbe0}section{margin-top:28px;border:1px solid #4b5b78;border-radius:20px;padding:22px;background:#253147}button{font:inherit;border:0;border-radius:14px;padding:15px 20px;width:100%;background:#d8e5ff;color:#162135;cursor:pointer}button.secondary{background:#34445f;color:#edf2ff;margin-top:12px}button:disabled{opacity:.55}#status{white-space:pre-line;font-size:14px}a{color:#b9d1ff}
</style>
<small>DEEPSEEK HARNESS · ANDROID</small><h1>你的手机编程工作台</h1>
<p>创建项目、编写和运行代码、管理 DSH 插件。需要操作手机时，连接并授权设备伴侣。</p>
<section><button id="open">打开手机 DSH</button><p id="status" role="status">正在检查本地运行组件…</p><button id="install" class="secondary" hidden>安装或更新运行组件</button></section>
<p>首次使用需安装独立运行组件，并在 Skivu 选择账号模型。编程环境可修改组件内的所有项目和运行文件，请备份重要内容。模型调用可能消耗账号额度。</p>
<p>首版支持 64 位安卓、Node 与基础 Shell。运行组件暂不能直接联网下载依赖；模型经 Skivu 授权调用。卸载组件会删除项目，请先备份。</p>
<script src="/skivu-sdk.js"></script><script type="module">
const component='org.skivu.dsh.runtime/org.skivu.dsh.runtime.RuntimeService';
const signer='39b262ea602a2c91dc914a7f7ba2dc86e6640e1ad11ca1f07ff61a076b435523';
const open=document.querySelector('#open'), install=document.querySelector('#install'), status=document.querySelector('#status');
async function check(){try{const providers=await Skivu.call('runtime.providers',{});const found=providers.find(p=>p.component===component && p.signerSha256===signer && p.protocol===1);open.disabled=!found;install.hidden=!!found;status.textContent=found?'运行组件已就绪。':'请安装官方运行组件，完成后返回此页。';}catch(error){open.disabled=true;status.textContent=error.message||'请先更新 Skivu。';}}
open.onclick=async()=>{open.disabled=true;try{await Skivu.call('runtime.open',{component,signerSha256:signer});status.textContent='本次运行已关闭。';}catch(error){status.textContent=error.message||'启动未完成，请检查组件安装及授权。';}finally{await check();}};
install.onclick=()=>Skivu.call('ui.openExternal',{url:'https://github.com/skyjjgw/skivu-dsh-runtime/releases/tag/v0.1.0'}).catch(error=>status.textContent=error.message);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});await check();
</script></html>
